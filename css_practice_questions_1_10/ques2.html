<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q2 - Height and Width Practice</title>
    <link rel="stylesheet" href="ques2.css">
</head>
<body>
    <header>
        <h1>Height &amp; Width Practice</h1>
    </header>

    <main>
        <section class="size-container">
            <article class="size-box box-one">
                <h2>Fixed PX</h2>
                <p>Width: 220px<br>Height: 180px</p>
            </article>

            <article class="size-box box-two">
                <h2>Percentage</h2>
                <p>Width: 40%<br>Min-height: 220px</p>
            </article>

            <article class="size-box box-three">
                <h2>VH &amp; EM</h2>
                <p>Height: 28vh<br>Max-width: 18em</p>
                <div class="overflow-demo">
                    This content demonstrates overflow. The box has limited dimensions, so extra content is handled using overflow: auto.
                </div>
            </article>
        </section>
    </main>

    <footer>&copy; 2026 Size Practice</footer>
</body>
</html>
