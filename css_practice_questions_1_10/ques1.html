<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1 - Borders and Padding</title>
    <link rel="stylesheet" href="ques1.css">
</head>
<body>
    <header>
        <h1>Borders &amp; Padding Demonstration</h1>
        <p>Hover over each box to see the border-color transition.</p>
    </header>

    <main>
        <section class="boxes" aria-label="Border and padding examples">
            <article class="box solid">
                <h2>Solid Border</h2>
                <p>Padding: 10px</p>
            </article>
            <article class="box dashed">
                <h2>Dashed Border</h2>
                <p>Padding: 20px</p>
            </article>
            <article class="box double">
                <h2>Double Border</h2>
                <p>Padding: 30px</p>
            </article>
            <article class="box groove">
                <h2>Groove Border</h2>
                <p>Padding: 40px</p>
            </article>
            <article class="box rounded">
                <h2>Rounded Corners</h2>
                <p>border-radius: 25px</p>
            </article>
        </section>
    </main>

    <footer>&copy; 2026 CSS Practice</footer>
</body>
</html>
