<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q9 - Outline and Focus Form</title>
    <link rel="stylesheet" href="ques9.css">
</head>
<body>
    <header>
        <h1>Outline &amp; Focus Styling</h1>
        <p>Click or tab into the fields to see different focus outlines.</p>
    </header>

    <main>
        <form class="contact-form">
            <div class="form-group">
                <label for="name">Name</label>
                <input id="name" type="text" placeholder="Enter your name">
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input id="email" type="email" placeholder="Enter your email">
            </div>

            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" rows="6" placeholder="Write your message"></textarea>
            </div>

            <button type="submit">Send Message</button>
        </form>
    </main>

    <footer>&copy; 2026 Form Styling Practice</footer>
</body>
</html>
