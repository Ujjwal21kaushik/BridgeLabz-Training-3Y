<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q6 - CSS Transformations</title>
    <link rel="stylesheet" href="ques6.css">
</head>
<body>
    <header>
        <h1>CSS Transformations Showcase</h1>
    </header>

    <main>
        <section class="transformations">
            <article class="transform-item">
                <div class="box rotate">Rotate</div>
                <p>rotate(12deg)</p>
            </article>

            <article class="transform-item">
                <div class="box scale">Scale</div>
                <p>scale(1.2)</p>
            </article>

            <article class="transform-item">
                <div class="box translate">Translate</div>
                <p>translateY(-15px)</p>
            </article>

            <article class="transform-item">
                <div class="box skew">Skew</div>
                <p>skew(10deg)</p>
            </article>
        </section>
    </main>

    <footer>&copy; 2026 Transform Practice</footer>
</body>
</html>
