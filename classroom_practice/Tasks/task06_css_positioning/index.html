<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
</head>
<body>

    <section>
        <div class="image">
            <img src="download.jpg" alt="">

            <div class="off">
                <p class="txt">20% OFF</p>
            </div>
            <div class="like">
                <i class="fa-regular fa-heart" style="color: rgb(29, 29, 28);"></i>
            </div>
            
            <div class="down-part">
                <span class="span">SPORTS SHOES</span>
                <h3>Premimum Runing shoes</h3>
                <i class="fa-solid fa-star" style="color: rgb(255, 212, 59);"></i>
                <i class="fa-solid fa-star" style="color: rgb(255, 212, 59);"></i>
                <i class="fa-solid fa-star" style="color: rgb(255, 212, 59);"></i>
                <i class="fa-solid fa-star" style="color: rgb(255, 212, 59);"></i>
                <i class="fa-solid fa-star" style="color: rgb(255, 212, 59);"></i> 
                <span class="rate">(120)</span><br>

                <span class="price">₹1,999</span><sub>₹2,499</sub><br>

                <button type="button" class="btn">Add to cart</button>
            </div>
        </div>

    </section>
    
</body>
</html>
