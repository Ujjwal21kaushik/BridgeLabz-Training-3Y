<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>YouTube Video Embed</title>
</head>
<body>
    <h1>My YouTube Video</h1>

    <!-- Percentage values make the iframe adjust with the browser width. -->

        src="https://www.youtube.com/embed/dQw4w9WgXcQ"
        width="80%"
        height="50%"
        title="YouTube video">
    </iframe>
</body>
</html>
