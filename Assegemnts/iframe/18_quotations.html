<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quotations</title>
</head>
<body>
    <h1>Long and Short Quotations</h1>

    <!-- Long quotation -->
    <blockquote>
        Learning HTML is useful because it provides the structure of web pages.
        It helps developers organize content using meaningful elements &amp; entities.
    </blockquote>

    <!-- Short quotation -->
    <p>As the saying goes, <q>keep learning and keep improving</q>.</p>
</body>
</html>
