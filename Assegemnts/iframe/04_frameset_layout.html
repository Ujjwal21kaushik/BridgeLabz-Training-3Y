<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Frameset Layout</title>
</head>

<!-- Frameset is a legacy HTML feature and is not supported in HTML5. -->
<frameset rows="30%,70%">
    <frame src="navigation.html" name="navigation" title="Navigation Frame">
    <frame src="welcome.html" name="content" title="Welcome Frame">
</frameset>
</html>
