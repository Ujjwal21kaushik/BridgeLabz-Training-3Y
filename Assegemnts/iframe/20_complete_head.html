<!DOCTYPE html>
<html lang="en">
<head>
    <!-- title gives the page its browser-tab title. -->
    <title>Complete HTML Head</title>

    <!-- charset defines the character encoding used by the document. -->
    <meta charset="UTF-8">

    <!-- description provides a short description of the webpage. -->
    <meta name="description" content="A webpage demonstrating important HTML head elements.">

    <!-- author identifies the creator of the webpage. -->
    <meta name="author" content="Ujjwal Kaushik">

    <!-- base sets the base URL used for relative links and resources. -->
    <base href="https://example.com/">

    <!-- link connects the document to an external resource such as a favicon. -->
    <link rel="icon" href="favicon.ico" type="image/x-icon">

    <!-- style contains CSS rules; it is intentionally empty for this assignment. -->
    <style>
    </style>

    <!-- script contains JavaScript; it is intentionally empty for this assignment. -->
    <script>
    </script>
</head>
<body>
    <h1>Important HTML Head Elements</h1>
    <p>This page demonstrates title, meta, base, link, style, and script elements.</p>
</body>
</html>
