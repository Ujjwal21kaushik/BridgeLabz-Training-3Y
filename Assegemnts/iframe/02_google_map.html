<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Google Map Embed</title>
</head>
<body>
    <h1>My City Map</h1>

    <!-- loading="lazy" delays loading the map until it is close to the visible area. -->
    <iframe
        src="https://www.google.com/maps?q=GLA%20University%2C%20Mathura&output=embed"
        title="Map showing GLA University"
        width="600"
        height="450"
        loading="lazy">
    </iframe>
</body>
</html>
