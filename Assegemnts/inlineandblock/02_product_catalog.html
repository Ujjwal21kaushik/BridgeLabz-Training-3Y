<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Catalog</title>
</head>
<body>
    <h1>Online Store - Product Catalog</h1>

    <!-- Product table -->
    <table border="1">
        <tr>
            <th colspan="5">Featured Products</th>
        </tr>
        <tr>
            <th>Product Name</th>
            <th>Image</th>
            <th>Description</th>
            <th>Price</th>
            <th>Availability</th>
        </tr>
        <tr>
            <td>Laptop</td>
            <td><img src="https://via.placeholder.com/100" alt="Laptop" width="100"></td>
            <td>Powerful laptop for study and work.</td>
            <td>₹60,000</td>
            <td rowspan="2">In Stock</td>
        </tr>
        <tr>
            <td>Wireless Mouse</td>
            <td><img src="https://via.placeholder.com/100" alt="Wireless Mouse" width="100"></td>
            <td>Comfortable wireless mouse.</td>
            <td>₹1,200</td>
        </tr>
        <tr>
            <td>Headphones</td>
            <td><img src="https://via.placeholder.com/100" alt="Headphones" width="100"></td>
            <td>Noise-isolating headphones.</td>
            <td>₹2,500</td>
            <td>Limited Stock</td>
        </tr>
    </table>
</body>
</html>
