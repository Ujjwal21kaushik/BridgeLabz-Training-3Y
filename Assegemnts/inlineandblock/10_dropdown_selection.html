<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dropdown Selection Page</title>
</head>
<body>
    <h1>Travel Selection</h1>

    <!-- Country selection -->
    <label for="country">Country:</label>
    <select id="country">
        <option selected>India</option>
        <option>Japan</option>
        <option>France</option>
    </select>
    <br><br>

    <!-- State selection -->
    <label for="state">State:</label>
    <select id="state">
        <option selected>Uttar Pradesh</option>
        <option>Delhi</option>
        <option>Rajasthan</option>
    </select>
    <br><br>

    <!-- City selection -->
    <label for="city">City:</label>
    <select id="city">
        <option selected>Varanasi</option>
        <option>Agra</option>
        <option>Lucknow</option>
    </select>
    <br><br>

    <!-- Tourist place selection -->
    <label for="place">Favorite Tourist Place:</label>
    <select id="place">
        <option selected>Varanasi Ghats</option>
        <option>Taj Mahal</option>
        <option>Agra Fort</option>
    </select>

    <!-- Summary -->
    <p>My choices are: India, Uttar Pradesh, Varanasi, and Varanasi Ghats.</p>
</body>
</html>
