<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Conference Schedule</title>
</head>
<body>
    <h1>Technology Conference 2026</h1>

    <!-- Conference schedule table -->
    <table border="1">
        <thead>
            <tr>
                <th>Session</th>
                <th>Time</th>
                <th>Topic</th>
                <th>Speaker</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td rowspan="2">Morning</td>
                <td>09:00 AM</td>
                <td>Opening Keynote</td>
                <td>Dr. Sharma</td>
            </tr>
            <tr>
                <td>11:00 AM</td>
                <td>Future of AI</td>
                <td>Ms. Kapoor</td>
            </tr>
            <tr>
                <td>Afternoon</td>
                <td>02:00 PM</td>
                <td>Cloud Computing</td>
                <td>Mr. Verma</td>
            </tr>
            <tr>
                <td>Evening</td>
                <td>06:00 PM</td>
                <td>Developer Panel</td>
                <td>Industry Experts</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="4">Conference ends at 08:00 PM.</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
