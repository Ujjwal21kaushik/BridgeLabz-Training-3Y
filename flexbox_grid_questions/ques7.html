<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Q7 - Loading Animation</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#111827}.loader{display:flex;gap:12px;align-items:center}.circle{width:18px;height:18px;border-radius:50%;background:white;animation:updown .8s ease-in-out infinite}.circle:nth-child(2){animation-delay:.15s}.circle:nth-child(3){animation-delay:.3s}@keyframes updown{0%,100%{transform:translateY(0)}50%{transform:translateY(-25px)}}
</style></head><body><div class="loader"><div class="circle"></div><div class="circle"></div><div class="circle"></div></div></body></html>
