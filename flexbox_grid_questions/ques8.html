<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Q8 - Photo Gallery</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f1f5f9;padding:35px}h1{text-align:center}.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px}figure{margin:0;background:white;border-radius:14px;overflow:hidden;box-shadow:0 4px 12px #0002}figure img{display:block;width:100%;height:230px;object-fit:cover;transition:transform .5s ease}figure:hover img{transform:scale(1.08)}figcaption{padding:15px;text-align:center;font-weight:bold}
</style></head><body><h1>Photo Gallery</h1><div class="gallery">
<figure><img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?w=700" alt="Nature"><figcaption>Nature</figcaption></figure>
<figure><img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=700" alt="Beach"><figcaption>Beach</figcaption></figure>
<figure><img src="https://images.unsplash.com/photo-1519681393784-d120267933ba?w=700" alt="Mountains"><figcaption>Mountains</figcaption></figure>
<figure><img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=700" alt="Lake"><figcaption>Lake</figcaption></figure>
<figure><img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=700" alt="Forest"><figcaption>Forest</figcaption></figure>
<figure><img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=700" alt="Landscape"><figcaption>Landscape</figcaption></figure>
</div></body></html>
