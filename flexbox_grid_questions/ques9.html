<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Q9 - Card Flip</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#e2e8f0;font-family:Arial}.card-container{width:330px;height:430px;perspective:1000px}.card{width:100%;height:100%;position:relative;transition:transform .8s;transform-style:preserve-3d}.card-container:hover .card{transform:rotateY(180deg)}.front,.back{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:20px;overflow:hidden;box-shadow:0 10px 25px #0003}.front{background:white}.front img{width:100%;height:270px;object-fit:cover}.front h2{text-align:center}.back{background:#4f46e5;color:white;transform:rotateY(180deg);display:flex;align-items:center;justify-content:center;text-align:center;padding:35px;font-size:20px;line-height:1.6}
</style></head><body><div class="card-container"><div class="card"><div class="front"><img src="https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=700" alt="Coding"><h2>Web Developer</h2></div><div class="back"><p>I build responsive, interactive and user-friendly websites using modern web technologies.</p></div></div></div></body></html>
