<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Q5 - Pricing</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial;background:#f8fafc;display:flex;align-items:center;justify-content:center;padding:40px}.pricing{display:flex;align-items:center;justify-content:center;gap:25px;width:100%}.card{width:290px;min-height:380px;background:white;border-radius:20px;padding:35px;text-align:center;box-shadow:0 8px 25px #0002;display:flex;flex-direction:column;justify-content:center;transition:.3s;animation:fade .9s ease both}.card:nth-child(2){min-height:420px;background:#4f46e5;color:white;transform:scale(1.05)}.card:hover{transform:translateY(-10px)}.card:nth-child(2):hover{transform:scale(1.05) translateY(-10px)}.price{font-size:38px;font-weight:bold}.btn{padding:12px 25px;border:0;border-radius:25px;cursor:pointer;background:#111827;color:white}.middle .btn{background:white;color:#4f46e5}@keyframes fade{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}@media(max-width:750px){.pricing{flex-direction:column}.card,.card:nth-child(2){width:min(90vw,350px);min-height:350px;transform:none}.card:nth-child(2):hover{transform:translateY(-10px)}}
</style></head><body><main class="pricing"><section class="card"><h2>Basic</h2><p class="price">₹499</p><p>5 Projects<br>10 GB Storage<br>Email Support</p><button class="btn">Choose Plan</button></section><section class="card middle"><h2>Pro</h2><p class="price">₹999</p><p>20 Projects<br>50 GB Storage<br>Priority Support</p><button class="btn">Choose Plan</button></section><section class="card"><h2>Premium</h2><p class="price">₹1,999</p><p>Unlimited Projects<br>200 GB Storage<br>24/7 Support</p><button class="btn">Choose Plan</button></section></main></body></html>
