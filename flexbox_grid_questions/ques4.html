<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Q4 - Dashboard</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f1f5f9}.dashboard{min-height:100vh;display:grid;grid-template-columns:220px 1fr;grid-template-rows:80px 1fr;gap:15px}.header{grid-column:1/3;background:#0f172a;color:white;display:flex;align-items:center;padding:0 30px;font-size:26px;font-weight:bold}.sidebar{background:#1e293b;color:white;padding:30px 20px}.sidebar a{display:block;color:white;text-decoration:none;padding:14px;border-radius:8px;margin-bottom:8px}.sidebar a:hover{background:#334155}.content{padding:25px;display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:1fr 1fr;gap:20px}.box{background:white;border-radius:15px;padding:25px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:bold;box-shadow:0 3px 10px #0001;transition:.3s}.box:hover{transform:scale(1.04);box-shadow:0 12px 25px #0003}.wide{grid-column:span 2}@media(max-width:700px){.dashboard{grid-template-columns:1fr;grid-template-rows:80px auto 1fr}.header{grid-column:1}.content{grid-template-columns:1fr}.wide{grid-column:span 1}.sidebar{padding:15px;display:flex;gap:8px;overflow:auto}.sidebar a{white-space:nowrap;margin:0}}
</style></head><body><div class="dashboard"><header class="header">Dashboard</header><aside class="sidebar"><a href="#">Overview</a><a href="#">Analytics</a><a href="#">Users</a><a href="#">Settings</a></aside><main class="content"><div class="box wide">Revenue Overview</div><div class="box">Users</div><div class="box">Orders</div></main></div></body></html>
